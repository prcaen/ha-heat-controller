# Example dashboard for the Heat Controller integration.
#
# Paste into a view (dashboard edit mode > Raw configuration editor) and
# adjust the entity IDs: they depend on the device name ("Heating") and on
# the entity names. Check them in Developer Tools > States.
type: vertical-stack
cards:
  # Virtual thermostat of the integration: temperature of the thermostat
  # room and current target. The +/- buttons adjust the thermostat room's
  # day target during the day (night/away setpoints at night and in away
  # mode) and the power button mirrors "Heating control". To watch the
  # boiler's own setpoint instead, use climate.netatmo_smart_thermostat.
  - type: thermostat
    entity: climate.heating_thermostat
    name: Heating

  # Absence: tap the date/time to pick the return moment, away mode follows
  # (it ends by itself at that moment, with pre-heating before the return).
  - type: entities
    title: Absence
    show_header_toggle: false
    entities:
      - entity: switch.heating_away_mode
      - entity: datetime.heating_away_until

  # Heat source: automatic regulation or forced splits / boiler.
  - type: entities
    title: Heat source
    entities:
      - entity: select.heating_heat_source_override
      - entity: sensor.heating_heat_source
      - entity: sensor.heating_heating_state

  # Multi-room mode (when rooms are configured on the entry): global mode
  # with the solar surplus as attributes, boiler demand, and per room the
  # heat source, the learned heating rate and the next pre-heating.
  # Duplicate the per-room block for each room sub-entry (entity names
  # follow the room names, e.g. sensor.salon_heat_source).
  - type: entities
    title: Hybrid regulation
    entities:
      - entity: sensor.heating_mode
      - entity: binary_sensor.heating_boiler_demand
      - entity: sensor.salon_heat_source
      - entity: sensor.salon_learned_heating_rate
      - entity: sensor.salon_next_pre_heating

  # Status and the main settings (all settings exist as number/time entities).
  - type: entities
    title: Settings
    entities:
      - entity: binary_sensor.heating_frost_protection
      - entity: sensor.heating_target_setpoint
      - entity: sensor.heating_pre_heat_duration
      - entity: number.heating_night_setpoint
      - entity: number.heating_away_setpoint
      - entity: number.heating_idle_setpoint
      - entity: number.heating_frost_setpoint
      - entity: number.heating_outdoor_threshold
      - entity: number.heating_hysteresis
      - entity: time.heating_day_start_mon
      - entity: time.heating_day_end_mon
      - entity: time.heating_day_start_tue
      - entity: time.heating_day_end_tue
      - entity: time.heating_day_start_wed
      - entity: time.heating_day_end_wed
      - entity: time.heating_day_start_thu
      - entity: time.heating_day_end_thu
      - entity: time.heating_day_start_fri
      - entity: time.heating_day_end_fri
      - entity: time.heating_day_start_sat
      - entity: time.heating_day_end_sat
      - entity: time.heating_day_start_sun
      - entity: time.heating_day_end_sun
      - entity: time.heating_return_time
